<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idle Time Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#667085;--line:#e4e7ec;--accent:#e30613;--accent2:#fdecee;--bar:#e30613;--ok:#12805c}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e24;--text:#e8eaed;--muted:#98a2b3;--line:#2b313a;--accent:#ff4d57;--accent2:#3a1d20;--bar:#ff4d57;--ok:#3ccf91}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:.15s}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent2)}
.drop b{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;user-select:none;background:var(--bg);font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{opacity:.75;margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:24px;font-weight:700}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;cursor:pointer;position:sticky;top:0;background:var(--card)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.u{cursor:pointer}
tr.u:hover td{background:var(--accent2)}
.bar{height:8px;background:var(--bar);border-radius:4px;min-width:2px}
.bw{width:140px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.muted{color:var(--muted)}
.hidden{display:none}
.detail td{background:var(--bg);white-space:normal}
.gaps{display:flex;flex-wrap:wrap;gap:6px}
.gap{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;background:var(--card)}
.toast{color:var(--ok);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Idle Time Analyzer</h1>
  <p class="sub">Upload the full Location Inventory Log export. Idle time per user = gaps between consecutive actions longer than the threshold.</p>

  <div class="card">
    <div id="drop" class="drop">
      <div><b>Click to choose</b> or drop the file here</div>
      <div class="muted" id="fileInfo">CSV / TSV (UTF-8 or UTF-16) or Excel</div>
      <input id="file" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls" class="hidden">
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <div class="grid">
        <label class="f">Idle threshold (minutes)<input id="thr" type="number" min="1" value="10"></label>
        <label class="f">Count as idle
          <select id="mode"><option value="full">Whole gap</option><option value="over">Only time above threshold</option></select>
        </label>
        <label class="f">Hub<select id="hub"></select></label>
        <label class="f">From<input id="from" type="datetime-local"></label>
        <label class="f">To<input id="to" type="datetime-local"></label>
        <label class="f">Search user<input id="q" type="search" placeholder="Name..."></label>
      </div>
      <div style="margin-top:14px">
        <div class="row"><span class="muted" style="font-size:12px;font-weight:600;text-transform:uppercase">Actions</span>
          <button class="btn" id="allA">All</button><button class="btn" id="noneA">None</button></div>
        <div class="chips" id="actions"></div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="copyLink">Copy link with these filters</button>
        <button class="btn p" id="export">Export results (CSV)</button>
        <span class="toast" id="toast"></span>
      </div>
    </div>

    <div class="kpis" id="kpis" style="margin-bottom:16px"></div>

    <div class="card tbl">
      <table>
        <thead><tr>
          <th data-k="user">User</th>
          <th data-k="n" class="num">Actions</th>
          <th data-k="first">First</th>
          <th data-k="last">Last</th>
          <th data-k="span" class="num">Span</th>
          <th data-k="idle" class="num">Idle</th>
          <th data-k="pct" class="num">Idle %</th>
          <th data-k="gaps" class="num">Idle gaps</th>
          <th data-k="max" class="num">Longest</th>
          <th></th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
      <p class="muted" id="foot" style="margin:10px 0 0"></p>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let rows = [], allActions = [], selected = new Set(), sortK = 'idle', sortDir = -1, results = [], openUser = null;
const params = new URLSearchParams(location.search);

// ---------- file loading ----------
const drop = $('#drop'), fileIn = $('#file');
drop.onclick = () => fileIn.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); };
fileIn.onchange = () => fileIn.files[0] && load(fileIn.files[0]);

function load(f) {
  $('#fileInfo').textContent = 'Reading ' + f.name + '...';
  const r = new FileReader();
  r.onload = () => {
    try {
      const buf = new Uint8Array(r.result);
      let table;
      if (/\.xlsx?$/i.test(f.name)) {
        const wb = XLSX.read(buf, { type: 'array' });
        table = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
      } else {
        table = parseText(decode(buf));
      }
      ingest(table);
      $('#fileInfo').textContent = f.name + ' — ' + rows.length.toLocaleString() + ' rows';
    } catch (err) { $('#fileInfo').textContent = 'Error: ' + err.message; }
  };
  r.readAsArrayBuffer(f);
}

function decode(b) {
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b.subarray(2));
  if (b.length > 1 && b[1] === 0 && b[0] !== 0) return new TextDecoder('utf-16le').decode(b);
  let t = new TextDecoder('utf-8').decode(b);
  return t.charCodeAt(0) === 0xFEFF ? t.slice(1) : t;
}

function parseText(t) {
  const firstLine = t.slice(0, t.indexOf('\n'));
  const d = (firstLine.split('\t').length > firstLine.split(',').length) ? '\t'
          : (firstLine.split(';').length > firstLine.split(',').length ? ';' : ',');
  const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"' && cell === '') q = true;
    else if (c === d) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); out.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); out.push(row); }
  return out;
}

function parseTime(s) {
  s = String(s).trim();
  let m = s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime();
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
  if (m) { let h = +m[4]; if (m[7]) { h %= 12; if (/pm/i.test(m[7])) h += 12; }
    return new Date(+m[3], m[1] - 1, +m[2], h, +m[5], +(m[6] || 0)).getTime(); }
  const t = Date.parse(s); return isNaN(t) ? null : t;
}

function ingest(table) {
  const norm = s => String(s).trim().toUpperCase().replace(/\s+/g, ' ');
  let hi = table.findIndex(r => r.map(norm).includes('ACTION BY'));
  if (hi < 0) throw new Error('Could not find an "ACTION BY" column');
  const h = table[hi].map(norm);
  const col = n => h.indexOf(n);
  const cU = col('ACTION BY'), cT = col('ACTION TIME'), cA = col('ACTION'), cH = col('HUB NAME');
  if (cT < 0) throw new Error('Could not find an "ACTION TIME" column');
  rows = [];
  for (let i = hi + 1; i < table.length; i++) {
    const r = table[i]; const u = (r[cU] || '').trim(); const t = parseTime(r[cT] || '');
    if (!u || t == null) continue;
    rows.push({ u, t, a: cA >= 0 ? (r[cA] || '').trim() || '(blank)' : '(all)', h: cH >= 0 ? (r[cH] || '').trim() : '' });
  }
  if (!rows.length) throw new Error('No valid rows found');
  const ac = {}; rows.forEach(r => ac[r.a] = (ac[r.a] || 0) + 1);
  allActions = Object.keys(ac).sort((a, b) => ac[b] - ac[a]);
  const pa = params.get('action');
  const wanted = pa ? pa.split(',').map(s => s.trim().toLowerCase()) : null;
  selected = new Set(wanted ? allActions.filter(a => wanted.includes(a.toLowerCase())) : allActions);
  if (!selected.size) selected = new Set(allActions);
  $('#actions').innerHTML = allActions.map(a =>
    `<span class="chip" data-a="${esc(a)}">${esc(a)}<small>${ac[a].toLocaleString()}</small></span>`).join('');
  $('#actions').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const a = c.dataset.a; selected.has(a) ? selected.delete(a) : selected.add(a); run(); });
  const hubs = [...new Set(rows.map(r => r.h).filter(Boolean))].sort();
  $('#hub').innerHTML = '<option value="">All hubs</option>' + hubs.map(x => `<option>${esc(x)}</option>`).join('');
  if (params.get('hub')) $('#hub').value = params.get('hub');
  if (params.get('threshold')) $('#thr').value = params.get('threshold');
  if (params.get('mode')) $('#mode').value = params.get('mode');
  const ts = rows.map(r => r.t); const mn = Math.min(...ts), mx = Math.max(...ts);
  $('#from').value = toLocal(mn); $('#to').value = toLocal(mx);
  $('#app').classList.remove('hidden');
  run();
}

// ---------- analysis ----------
function run() {
  $('#actions').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', selected.has(c.dataset.a)));
  const thr = Math.max(1, +$('#thr').value || 10) * 60000, mode = $('#mode').value, hub = $('#hub').value;
  const from = $('#from').value ? new Date($('#from').value).getTime() : -Infinity;
  const to = $('#to').value ? new Date($('#to').value).getTime() + 59999 : Infinity;
  const by = new Map();
  for (const r of rows) {
    if (!selected.has(r.a) || (hub && r.h !== hub) || r.t < from || r.t > to) continue;
    if (!by.has(r.u)) by.set(r.u, []); by.get(r.u).push(r.t);
  }
  results = [];
  for (const [user, ts] of by) {
    ts.sort((a, b) => a - b);
    let idle = 0, gaps = [], max = 0;
    for (let i = 1; i < ts.length; i++) {
      const g = ts[i] - ts[i - 1];
      if (g > thr) { const c = mode === 'over' ? g - thr : g; idle += c; gaps.push([ts[i - 1], ts[i], g]); if (g > max) max = g; }
    }
    const span = ts[ts.length - 1] - ts[0];
    results.push({ user, n: ts.length, first: ts[0], last: ts[ts.length - 1], span, idle, pct: span ? idle / span : 0, gaps: gaps.length, max, list: gaps });
  }
  render(); syncUrl();
}

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const list = results.filter(r => !q || r.user.toLowerCase().includes(q));
  list.sort((a, b) => (a[sortK] > b[sortK] ? 1 : a[sortK] < b[sortK] ? -1 : 0) * sortDir);
  const tIdle = list.reduce((s, r) => s + r.idle, 0), tSpan = list.reduce((s, r) => s + r.span, 0);
  const tAct = list.reduce((s, r) => s + r.n, 0);
  const top = list.slice().sort((a, b) => b.idle - a.idle)[0];
  $('#kpis').innerHTML = [
    ['Users', list.length.toLocaleString()],
    ['Actions', tAct.toLocaleString()],
    ['Total idle', dur(tIdle)],
    ['Avg idle / user', dur(list.length ? tIdle / list.length : 0)],
    ['Idle % of span', tSpan ? (tIdle / tSpan * 100).toFixed(1) + '%' : '—'],
    ['Most idle', top ? esc(top.user) + ' · ' + dur(top.idle) : '—'],
  ].map(([l, v]) => `<div class="kpi"><div class="l">${l}</div><div class="v" style="${l === 'Most idle' ? 'font-size:15px' : ''}">${v}</div></div>`).join('');
  const maxIdle = Math.max(1, ...list.map(r => r.idle));
  $('#tb').innerHTML = list.map(r => `
    <tr class="u" data-u="${esc(r.user)}">
      <td>${esc(r.user)}</td><td class="num">${r.n.toLocaleString()}</td>
      <td>${fmt(r.first)}</td><td>${fmt(r.last)}</td><td class="num">${dur(r.span)}</td>
      <td class="num"><b>${dur(r.idle)}</b></td><td class="num">${(r.pct * 100).toFixed(1)}%</td>
      <td class="num">${r.gaps}</td><td class="num">${dur(r.max)}</td>
      <td class="bw"><div class="bar" style="width:${r.idle / maxIdle * 100}%"></div></td>
    </tr>${openUser === r.user ? `<tr class="detail"><td colspan="10"><div class="gaps">${
      r.list.length ? r.list.map(g => `<span class="gap">${fmt(g[0])} → ${fmt(g[1])} · <b>${dur(g[2])}</b></span>`).join('') : '<span class="muted">No idle gaps</span>'}</div></td></tr>` : ''}`).join('');
  $('#tb').querySelectorAll('tr.u').forEach(tr => tr.onclick = () => { openUser = openUser === tr.dataset.u ? null : tr.dataset.u; render(); });
  document.querySelectorAll('th[data-k]').forEach(th => th.textContent = th.textContent.replace(/ [▲▼]$/, '') + (th.dataset.k === sortK ? (sortDir < 0 ? ' ▼' : ' ▲') : ''));
  $('#foot').textContent = `Actions: ${[...selected].join(', ') || 'none'} · Threshold ${$('#thr').value} min · Click a user to see their idle gaps.`;
}

// ---------- helpers ----------
function dur(ms) { const m = Math.round(ms / 60000); const h = Math.floor(m / 60); return h ? `${h}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`; }
function fmt(t) { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function toLocal(t) { const d = new Date(t - new Date(t).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function syncUrl() {
  const p = new URLSearchParams();
  if (selected.size && selected.size < allActions.length) p.set('action', [...selected].join(','));
  if ($('#hub').value) p.set('hub', $('#hub').value);
  if ($('#thr').value !== '10') p.set('threshold', $('#thr').value);
  if ($('#mode').value !== 'full') p.set('mode', $('#mode').value);
  const s = p.toString(); history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
}

['#thr', '#mode', '#hub', '#from', '#to'].forEach(s => $(s).addEventListener('input', run));
$('#q').addEventListener('input', render);
$('#allA').onclick = () => { selected = new Set(allActions); run(); };
$('#noneA').onclick = () => { selected = new Set(); run(); };
document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
  const k = th.dataset.k; if (sortK === k) sortDir *= -1; else { sortK = k; sortDir = k === 'user' ? 1 : -1; } render(); });
$('#copyLink').onclick = () => { navigator.clipboard.writeText(location.href).then(() => { $('#toast').textContent = 'Link copied'; setTimeout(() => $('#toast').textContent = '', 1800); }); };
$('#export').onclick = () => {
  const head = ['User', 'Actions', 'First', 'Last', 'Span (min)', 'Idle (min)', 'Idle %', 'Idle gaps', 'Longest gap (min)'];
  const lines = [head].concat(results.slice().sort((a, b) => b.idle - a.idle).map(r => [r.user, r.n, fmt(r.first), fmt(r.last),
    Math.round(r.span / 6e4), Math.round(r.idle / 6e4), (r.pct * 100).toFixed(1), r.gaps, Math.round(r.max / 6e4)]));
  const csv = lines.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = 'idle_time_' + ([...selected].length === 1 ? [...selected][0].replace(/\W+/g, '_') : 'all') + '.csv'; a.click();
};
</script>
</body>
</html>
